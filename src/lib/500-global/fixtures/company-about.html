<!doctype html>
<html lang="en">
  <head>
    <title>About Example Company</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Example Company",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Boston",
          "addressCountry": "United States of America"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <p>Our headquarters are in Boston, USA; with offices across Europe.</p>
      <address>Additional sales office: Toronto, Canada</address>
    </main>
  </body>
</html>
